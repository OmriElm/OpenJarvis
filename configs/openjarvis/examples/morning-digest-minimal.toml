# Morning Digest — Minimal setup (just Ollama + Gmail)
# The simplest possible config to get a working digest.
# Copy to ~/.openjarvis/config.toml
#
# Requirements:
#   - Ollama installed with any model
#   - Google OAuth credentials (jarvis connect gdrive)
#   - OpenAI API key for TTS (or skip audio with --text-only)

[engine]
default = "ollama"

[intelligence]
default_model = "qwen3.5:4b"      # Small, fast, runs on any machine

[tools]
enabled = ["digest_collect", "text_to_speech"]

[digest]
enabled = true
persona = "jarvis"
honorific = "sir"
tts_backend = "openai"
voice_id = "onyx"
sections = ["messages", "calendar"]
# timezone = "Asia/Jerusalem"          # IANA name used for the cron schedule
# schedule = "0 7 * * *"               # local time in timezone
# style = "text"                       # "spoken" (default) or scannable "text"
# max_words = 350
# deliver_to = ["telegram:123456789"]  # token: [channel.telegram] or TELEGRAM_BOT_TOKEN
#
# `jarvis serve` runs this schedule. A miss fires once if the process
# starts within [scheduler] misfire_grace_seconds (default 2 hours).

[digest.messages]
sources = ["gmail"]
# unread_only = true          # skip mail that is already read
# unread_hours_back = 168     # 7 days; 0 = every unread message

[digest.calendar]
sources = ["gcalendar"]
